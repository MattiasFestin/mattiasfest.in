# The URL the site will be built for
base_url = "https://mattiasfest.in"
title = "mattiasfest.in"
description = "Mattias' personal blog"
generate_feeds = true

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"
extra_grammars = ["syntaxes/math.tmLanguage.json"]

[extra]
# Analytics: GoatCounter site code (the CODE in https://CODE.goatcounter.com).
# Leave empty to disable analytics.
goatcounter = "mattiasfestin"

# Comments: giscus (GitHub Discussions). Enable Discussions on the repo,
# install https://github.com/apps/giscus, then grab category + category id
# from https://giscus.org. Comments render only when giscus_category_id is set.
giscus_repo = "MattiasFestin/mattiasfest.in"
giscus_repo_id = "R_kgDOTlPWJA"
giscus_category = "Announcements"
giscus_category_id = "DIC_kwDOTlPWJM4DCPjg"
