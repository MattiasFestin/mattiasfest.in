{% set filename = file | default(value="") %}
{% set caption_text = caption | default(value="") %}
{% set label = title | default(value=caption_text) %}
{% set explainer_title = explainer_title | default(value="What to watch for") %}
<figure class="manim-figure"{% if label %} aria-label="{{ label }}"{% endif %}>
  <div class="manim-player">
    <div class="manim-player-titlebar">
      <span class="manim-player-title">Media Player</span>
    </div>
    <div class="manim-player-screen">
      <video class="manim-video" autoplay muted loop playsinline preload="metadata"{% if poster %} poster="{{ poster }}"{% endif %}>
        <source src="/videos/{{ filename }}.webm" type="video/webm">
        <source src="/videos/{{ filename }}.mp4" type="video/mp4">
        Your browser does not support embedded video.
      </video>
    </div>
    <div class="manim-player-transport" role="group" aria-label="Animation controls">
      <div class="manim-player-buttons">
        <button class="manim-player-button" type="button" data-manim-action="play" aria-label="Play animation" disabled>▶</button>
        <button class="manim-player-button" type="button" data-manim-action="stop" aria-label="Stop and rewind animation" disabled>■</button>
        <button class="manim-player-button" type="button" data-manim-action="pause" aria-label="Pause animation" disabled>❚❚</button>
      </div>
      <input class="manim-player-scrubber" type="range" min="0" max="0" value="0" step="0.01" aria-label="Seek animation" disabled>
      <span class="manim-player-time">0:00 / 0:00</span>
    </div>
  </div>
  {% if step_one %}
  <aside class="manim-explainer" role="note" aria-label="{{ explainer_title }}">
    <strong class="manim-explainer-title">{{ explainer_title }}</strong>
    <ol>
      <li>{{ step_one }}</li>
      {% if step_two %}<li>{{ step_two }}</li>{% endif %}
      {% if step_three %}<li>{{ step_three }}</li>{% endif %}
    </ol>
  </aside>
  {% endif %}
  {% if caption_text %}<figcaption>{{ caption_text }}</figcaption>{% endif %}
</figure>
