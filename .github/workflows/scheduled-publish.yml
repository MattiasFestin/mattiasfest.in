name: Publish scheduled posts

# Runs once per day. If any post's publication date is today
# (Europe/Stockholm), re-runs the deploy workflow; the CI build prunes
# still-future posts, so the newly due post goes live and later ones
# stay hidden. Once the deploy succeeds, posts that opted in with a
# `linkedin = "..."` message in [extra] are announced on LinkedIn.
# Because this workflow runs once per day, announcements can't double-post.

on:
  schedule:
    - cron: "15 4 * * *" # 04:15 UTC = 05:15/06:15 Stockholm
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for posts due today
        id: due
        run: |
          TODAY=$(TZ=Europe/Stockholm date +%F)
          echo "Today (Stockholm): $TODAY"
          DUE=$(grep -l "^date = $TODAY$" content/blog/*.md 2>/dev/null || true)
          if [ -n "$DUE" ]; then
            echo "Posts due today:"
            echo "$DUE"
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "No posts due today."
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site deploy
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Wait for deploy to finish
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 15
          RUN_ID=$(gh run list --workflow=deploy.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Watching deploy run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Announce on LinkedIn
        if: steps.due.outputs.due == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: node scripts/linkedin-share.mjs
