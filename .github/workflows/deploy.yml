name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZOLA_VERSION: 0.22.1
  TYPST_VERSION: 0.14.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xz -C /usr/local/bin
          zola --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Manim 0.20 supports Python 3.12, which is also required by the
      # NumPy version pinned for reproducible snippet output. Keep its isolated
      # environment as the Python on PATH for the rest of the build:
      # scripts/run-python.mjs then executes snippets with the same pinned
      # interpreter that rendered the figures.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
          # Caches pip's downloaded wheels/source archives. The complete
          # virtualenv is cached separately below, so a warm build skips both
          # download and installation work.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-manim.txt

      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libcairo2-dev libpango1.0-dev pkg-config

      - name: Install Typst
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            --output /tmp/typst.tar.xz
          tar --extract --xz --file /tmp/typst.tar.xz --directory /tmp
          sudo install --mode=0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      # A venv contains native Manim dependencies too (pycairo/manimpango),
      # so restoring it avoids considerably more than reusing pip downloads.
      # Exact Python patch version is part of the key because venv scripts and
      # compiled wheels are tied to its interpreter location/ABI.
      - name: Cache Manim build environment
        id: manim-venv
        uses: actions/cache@v4
        with:
          path: .venv-manim
          key: manim-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-manim.txt') }}

      - name: Create Manim build environment
        run: |
          if [ ! -x .venv-manim/bin/manim ]; then
            python -m venv .venv-manim
            .venv-manim/bin/pip install --upgrade pip
            .venv-manim/bin/pip install -r requirements.txt -r requirements-manim.txt
          fi
          echo "$GITHUB_WORKSPACE/.venv-manim/bin" >> "$GITHUB_PATH"
          .venv-manim/bin/manim --version

      - name: Install dependencies
        run: npm ci

      # Browser binaries are ~370 MB and change only when Playwright
      # itself is upgraded, so key the cache on its version rather than
      # on package-lock.json (which would re-download on any dep bump).
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # System libraries live outside the cached directory (apt, not
      # ~/.cache), so they still need installing on a cache hit.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Run e2e tests
        run: npm run test:ci

      - name: Run external-dependency e2e tests (non-blocking)
        # Boots the real Pyodide runtime from a CDN. Informative only:
        # a third-party outage must never block publishing a post.
        continue-on-error: true
        run: npm run test:external

      # Final video rendering and VP9 transcoding dominate cold builds. Cache
      # every delivery pair independently, so an unrelated site change restores
      # all three and a missing pair is the only one that gets rendered.
      #
      # A post's scenes share one source module, so changing that module or a
      # shared helper invalidates that post's delivery pairs. Bump v1 for a
      # renderer or encoder change.
      - name: Cache nearest-neighbor video
        id: manim-nearest-neighbor
        uses: actions/cache@v4
        with:
          path: |
            static/videos/0001-nearest-neighbor-is-a-decision.mp4
            static/videos/0001-nearest-neighbor-is-a-decision.webm
          key: manim-video-v1-0001-nearest-neighbor-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ env.TYPST_VERSION }}-${{ hashFiles('requirements.txt', 'requirements-manim.txt', 'manim/render.sh', 'manim/p0001_linear_vector_spaces.py', 'manim/mfblog/**/*.py') }}

      - name: Cache unit-balls video
        id: manim-unit-balls
        uses: actions/cache@v4
        with:
          path: |
            static/videos/0001-unit-balls-and-sparsity.mp4
            static/videos/0001-unit-balls-and-sparsity.webm
          key: manim-video-v1-0001-unit-balls-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ env.TYPST_VERSION }}-${{ hashFiles('requirements.txt', 'requirements-manim.txt', 'manim/render.sh', 'manim/p0001_linear_vector_spaces.py', 'manim/mfblog/**/*.py') }}

      - name: Cache high-dimensions video
        id: manim-high-dimensions
        uses: actions/cache@v4
        with:
          path: |
            static/videos/0001-high-dimensions-are-weird.mp4
            static/videos/0001-high-dimensions-are-weird.webm
          key: manim-video-v1-0001-high-dimensions-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ env.TYPST_VERSION }}-${{ hashFiles('requirements.txt', 'requirements-manim.txt', 'manim/render.sh', 'manim/p0001_linear_vector_spaces.py', 'manim/mfblog/**/*.py') }}

      - name: Cache loss-choice video
        id: manim-loss-choice
        uses: actions/cache@v4
        with:
          path: |
            static/videos/0005-loss-chooses-the-line.mp4
            static/videos/0005-loss-chooses-the-line.webm
          key: manim-video-v1-0005-loss-choice-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ env.TYPST_VERSION }}-${{ hashFiles('requirements.txt', 'requirements-manim.txt', 'manim/render.sh', 'manim/p0005_linear_regression.py', 'manim/mfblog/**/*.py') }}

      - name: Cache least-squares projection video
        id: manim-projection
        uses: actions/cache@v4
        with:
          path: |
            static/videos/0005-least-squares-is-a-projection.mp4
            static/videos/0005-least-squares-is-a-projection.webm
          key: manim-video-v1-0005-projection-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ env.TYPST_VERSION }}-${{ hashFiles('requirements.txt', 'requirements-manim.txt', 'manim/render.sh', 'manim/p0005_linear_regression.py', 'manim/mfblog/**/*.py') }}

      - name: Cache gradient-descent video
        id: manim-gradient-descent
        uses: actions/cache@v4
        with:
          path: |
            static/videos/0005-gradient-descent-finds-the-line.mp4
            static/videos/0005-gradient-descent-finds-the-line.webm
          key: manim-video-v1-0005-gradient-descent-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ env.TYPST_VERSION }}-${{ hashFiles('requirements.txt', 'requirements-manim.txt', 'manim/render.sh', 'manim/p0005_linear_regression.py', 'manim/mfblog/**/*.py') }}

      - name: Build site (prune scheduled posts, Zola + math rendering)
        run: npm run build:ci:cached

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
